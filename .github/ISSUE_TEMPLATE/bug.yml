name: Bug Report
description: Something doesn't work the way the docs say it should.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Import
      options:
        - "@web-kits/react/number-transition"
        - "@web-kits/react/text-transition"
        - "@web-kits/react/content-transition"
        - "@web-kits/react/family"
        - "@web-kits/react/animation"
        - "@web-kits/react/origin"
        - "@web-kits/react/motion-blur"
        - "@web-kits/react/progressive-blur"
        - "@web-kits/react/caret"
        - "@web-kits/audio"
        - Website or docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What Happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a sandbox or repo, or the smallest code that shows it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Safari 27 on macOS 27
