name: Feature Request
description: Something a kit should do that it doesn't yet.
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Import
      options:
        - "@web-kits/react/number-transition"
        - "@web-kits/react/text-transition"
        - "@web-kits/react/content-transition"
        - "@web-kits/react/family"
        - "@web-kits/react/animation"
        - "@web-kits/react/origin"
        - "@web-kits/react/motion-blur"
        - "@web-kits/react/progressive-blur"
        - "@web-kits/react/sound"
        - A new kit
        - Website or docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to build and where the kit gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you'd like, with a reference if you have one.
